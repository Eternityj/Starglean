<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light only">
    <meta name="supported-color-schemes" content="light">
    <title>Your Starglean verification code</title>
  </head>
  <body style="margin:0;padding:0;background:#f2ebdd;color:#111c2d;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#f2ebdd;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:520px;background:#080f1d;border:1px solid #8d794f;border-radius:18px;">
            <tr>
              <td style="padding:34px 28px 30px;">
                <p style="margin:0 0 18px;color:#c8a96b;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;">Starglean</p>
                <h1 style="margin:0 0 14px;color:#f2ebdd;font-size:26px;line-height:1.25;font-weight:650;">Your verification code</h1>
                <p style="margin:0 0 24px;color:#c7c0b4;font-size:16px;line-height:1.6;">Enter this code in Starglean to continue signing in or recovering access.</p>
                <div style="margin:0 0 24px;padding:18px 16px;background:#111c2d;border:1px solid #c8a96b;border-radius:12px;color:#f2d99b;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:28px;font-weight:700;line-height:1.2;letter-spacing:4px;text-align:center;">{{ .Token }}</div>
                <p style="margin:0;color:#9ba4b0;font-size:13px;line-height:1.6;">If you did not request this code, you can ignore this email. Do not share the code with anyone.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
